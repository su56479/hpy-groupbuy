# ============================================================
#  好朋友市集团购商城 - GitHub Pages 自动部署工作流
#  每次 push 到 main 分支，会自动：
#    1. 安装依赖 → 2. 构建 mobile(H5) + admin(后台)
#    3. 把两个 dist 合并后部署到 GitHub Pages
#
#  部署后访问地址：
#    H5商城：   https://<你的用户名>.github.io/<仓库名>/m/
#    管理后台： https://<你的用户名>.github.io/<仓库名>/admin/
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # 多项目统一缓存根目录
          cache-dependency-path: |
            server/package.json
            mobile/package.json
            admin/package.json

      # ----- 1. 构建移动端 H5 -----
      - name: Install (mobile)
        working-directory: ./mobile
        run: npm ci || npm install --no-audit --no-fund

      - name: Build (mobile H5)
        working-directory: ./mobile
        env:
          # ⭐ 生产环境：后端公网地址（您部署 Node 服务的域名，例如 https://hpy-server.onrender.com）
          # 方式 1：直接写死在这里
          # VITE_API_BASE: https://your-backend.example.com
          # 方式 2（推荐）：在仓库 Settings → Secrets and variables → Actions → Variables 中新建名称 VITE_API_BASE，这里自动读取
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      # ----- 2. 构建后台管理 -----
      - name: Install (admin)
        working-directory: ./admin
        run: npm ci || npm install --no-audit --no-fund

      - name: Build (admin panel)
        working-directory: ./admin
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      # ----- 3. 合并两个 dist 到同一个 Pages 根目录 -----
      - name: Assemble Pages output
        run: |
          mkdir -p _pages
          # 移动端 → /m/ 子路径（对应 vite.config.js 的 base: '/m/'）
          cp -r mobile/dist _pages/m
          # 后台 → /admin/ 子路径（对应 vite.config.js 的 base: '/admin/'）
          cp -r admin/dist _pages/admin
          # 根路径重定向页（访问仓库根地址自动跳转到 H5 商城）
          cat > _pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./m/" />
            <title>好朋友集市</title>
          </head>
          <body style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:linear-gradient(135deg,#1677FF 0%,#4096FF 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;">
            <div style="text-align:center">
              <div style="font-size:48px;margin-bottom:16px">🛒</div>
              <h1 style="margin:0 0 8px">好朋友集市</h1>
              <p style="opacity:.9;margin:0 0 24px">正在跳转到商城首页…</p>
              <p>
                <a href="./m/" style="background:#fff;color:#1677FF;padding:10px 22px;border-radius:999px;text-decoration:none;font-weight:700">进入商城 →</a>
              </p>
            </div>
          </body>
          </html>
          EOF
          # 可选：放一个 README 说明页面
          ls -la _pages _pages/m _pages/admin

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
