version: "3.8"

services:
  hpy-groupbuy:
    build: .
    container_name: hpy-groupbuy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
