<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1677FF" />
  <meta http-equiv="refresh" content="0; url=./m/" />
  <title>好朋友集市</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #1677FF 0%, #4096FF 40%, #69B1FF 100%);
      display: flex; align-items: center; justify-content: center;
      color: #fff; padding: 20px;
    }
    .wrap { text-align: center; }
    .logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: rgba(255,255,255,0.2);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; }
    .sub { font-size: 13px; opacity: 0.85; margin-bottom: 24px; }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alt {
      margin-top: 18px; font-size: 12px; opacity: 0.85;
    }
    .alt a {
      color: #fff; text-decoration: underline; margin: 0 6px;
    }
  </style>
  <script>
    // 立即跳转（比 meta refresh 更快，且不会被部分浏览器拦截）
    (function () {
      var base = document.location.pathname.replace(/[^\/]+$/, '');
      if (!base.endsWith('/')) base += '/';
      window.location.replace(base + 'm/');
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="logo">🛒</div>
    <h1>好朋友集市</h1>
    <p class="sub">正在为您进入商城…</p>
    <span class="spinner" aria-hidden="true"></span>
    <p class="alt">
      如果长时间未跳转，请手动进入：
      <a href="./m/">📱 商城购物</a> ·
      <a href="./admin/">🛠️ 管理后台</a>
    </p>
  </div>
</body>
</html>
